    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="/icon.png" />

      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
    ></script>

    <!-- <script defer src="object.js"></script> -->
    <script defer src="script.js"></script>

    <title>mapty // Map your workouts</title>
  </head>
  <body>
    <div class="sidebar">
      <img src="logo.png" alt="Logo" class="logo" />

      <ul class="workouts">
        <div class="workout-controls">
          <label class="sort-label" for="sort-workouts">Sort by</label>
          <select id="sort-workouts" class="sort-select">
            <option value="date">Newest</option>
            <option value="type">Type</option>
            <option value="duration">Duration</option>
            <option value="distance">Distance</option>
            <option value="cadence">Cadence</option>
            <option value="elevationGain">Elevation gain</option>
          </select>
          <button type="button" class="delete-all-btn">Delete all</button>
        </div>
        <p class="message" role="status" aria-live="polite"></p>
        <form class="form hidden">
          <div class="form__row">
            <label class="form__label">Type</label>
            <select
              class="form__input form__input--type"
              aria-label="Workout type"
            >
              <option value="running">Running</option>
              <option value="cycling">Cycling</option>
            </select>
          </div>
          <div class="form__row">
            <label class="form__label">Distance</label>
            <input class="form__input form__input--distance" placeholder="km" />
          </div>
          <div class="form__row">
            <label class="form__label">Duration</label>
            <input
              class="form__input form__input--duration"
              placeholder="min"
            />
          </div>
          <div class="form__row">
            <label class="form__label">Cadence</label>
            <input
              class="form__input form__input--cadence"
              placeholder="step/min"
            />
          </div>
          <div class="form__row form__row--hidden">
            <label class="form__label">Elev Gain</label>
            <input
              class="form__input form__input--elevation"
              placeholder="meters"
            />
          </div>
          <button type="submit" class="form__btn">Save workout</button>
          <button type="button" class="form__cancel">Cancel</button>
        </form>

    </div>

    <div class="map-container">
      <div class="map-tools">
        <form class="map-search-form">
          <label class="visually-hidden" for="map-search"
            >Search location</label
          >
          <input
            id="map-search"
            class="map-search-input"
            type="search"
            placeholder="Search for a place"
            autocomplete="off"
          />
          <button type="submit" class="map-search-button">Search</button>
          <button type="button" class="map-search-clear hidden">Clear</button>
        </form>
        <div
          class="map-search-results"
          role="listbox"
          aria-label="Location search results"
        ></div>
      </div>
      <button type="button" class="find-location-button">
        Find my location
      </button>
      <div id="map"></div>
    </div>
